services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nutrisport-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment:
      - DB_HOST=db
      - DB_DATABASE=nutrisport
      - DB_USERNAME=nutrisport
      - DB_PASSWORD=nutrisport_secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - db
      - redis

  webserver:
    image: nginx:alpine
    container_name: nutrisport-webserver
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  db:
    image: mariadb:10.6
    container_name: nutrisport-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: nutrisport
      MYSQL_USER: nutrisport
      MYSQL_PASSWORD: nutrisport_secret
      MYSQL_ROOT_PASSWORD: root_secret
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: nutrisport-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  db_data:
  redis_data:
